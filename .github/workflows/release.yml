name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p asm

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../asm-${{ matrix.target }}.tar.gz asm
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ matrix.target }}
          path: asm-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum asm-*.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            asm-*.tar.gz
            checksums.txt

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute checksums
        id: sha
        run: |
          echo "aarch64=$(sha256sum asm-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_mac=$(sha256sum asm-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(sha256sum asm-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: NamhaeSusan/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          sed -i "s/version \".*\"/version \"${VER}\"/" Formula/asm.rb
          sed -i "/aarch64-apple-darwin/,/sha256/{s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.aarch64 }}\"/}" Formula/asm.rb
          sed -i "/x86_64-apple-darwin/,/sha256/{s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.x86_64_mac }}\"/}" Formula/asm.rb
          sed -i "/x86_64-unknown-linux-gnu/,/sha256/{s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.x86_64_linux }}\"/}" Formula/asm.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/asm.rb
          git commit -m "asm ${VERSION#v}"
          git push
